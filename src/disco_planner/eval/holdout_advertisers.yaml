# HOLDOUT evaluation set: 100 potential advertisers for the Disco ad planner.
#
# Purpose: check the planner is not overfitted to the 15 example briefs
# (data/example_advertisers.txt) and the 20-publisher catalog. None of these
# brands overlap with the 15 tuned examples.
#
# Written BLIND to the scoring code: the briefs and the expected_gate labels
# were authored from the catalog/personas/examples and web research only,
# without reading the planner, gate logic, or eval runner. expected_gate is a
# rough human expectation, not ground truth.
#
# Each brief is written as the brand's marketing manager might type it; they
# are paraphrases (not real brand copy), and details such as prices are
# approximate. source_url is the brand's site (or a directory listing for the
# local plumber) used to verify the business exists. A few sites return 403/429 to curl (bot blocking) but exist.
#
# Segments: in_catalog=55, out_of_catalog=30, edge=15
# (edge = B2B x5, local services x2, non-profit x2, regulated/political x4
#  [sensitive: true], deliberately vague x2). out_of_catalog also contains 4
#  sensitive items (fintech, insurance, alcohol, CBD).
#
# Fields: id, brand, source_url, segment, category, clarity, expected_gate, sensitive, text
