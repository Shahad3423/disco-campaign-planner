# Blind hand-labeled golden set; see README.md in this directory.
# Labeled 2026-10-30, independent of any scoring or ranking code.
- id: 1
  text: We sell premium dog food for senior dogs, targeting owners who care about joint health and longevity.
    Grain-free, vet-formulated, subscription-based.
  expected_gate: proceed
  must_include:
  - pub_018
  nice_to_have:
  - pub_015
  - pub_008
  must_exclude:
  - pub_005
  - pub_013
  - pub_019
  - pub_004
  competitor_conflict:
  - pub_007
  - pub_009
  plausible_personas:
  - persona_004
  - persona_002
  - persona_001
  implausible_personas:
  - persona_008
  - persona_010
  claims_to_watch:
  - Do not say 'vet-recommended' or 'vet-approved'; the brief only says vet-formulated.
  - Do not promise to cure, treat, or reverse arthritis or joint disease, or add lifespan guarantees;
    'joint health' and 'longevity' are the advertiser's framing, keep it supportive.
  - Do not invent clinical studies, ingredient percentages (glucosamine doses etc.), prices, or discounts.
  - Grain-free, subscription, and vet-formulated are the only product facts available.
  rationale: Premium subscription dog food is directly sold by pub_007 Pawline (pet_food, subscription,
    'responsive to premium positioning') and pub_009 Ruffco (pet_food), so per D1 both are competitor
    conflicts that should be flagged and down-ranked, not ranked first. The best non-competing dog-owner
    audience is pub_018 Tailcrate (pet_supplies/toys/treats, 'treating dogs as family'), though its AOV
    of $35 and 'fun, playful' voice fit senior joint-health messaging only loosely and treats are adjacent.
    Ranking Pawline/Ruffco with a conflict flag is defensible; ranking them above all non-conflicting
    options is not.
  difficulty: medium
