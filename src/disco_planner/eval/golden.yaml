  claims_to_watch:
  - 'Make no health claims: do not claim adaptogens reduce stress, improve focus or mood, or ''detox'';
    do not claim to cure or prevent hangovers beyond the plain fact that it contains no alcohol.'
  - Do not name specific adaptogens, doses, sugar/calorie figures, or 'sober' as a medical state; none
    are in the brief.
  - pub_012 Daily Form's audience is 'skeptical of unsubstantiated health claims', so any claim-heavy
    copy there is a risk.
  - 'pub_001 Swiftcart has an ''alcohol'' subcategory: avoid copy that disparages drinking or targets
    minors.'
  rationale: pub_020 Pop & Sip (functional_beverages, soda_alternative; 'health-curious but indulgence-seeking')
    is the best audience match but sells a directly competing product, so it is flagged. pub_008 Pantrygood
    (natural, 'responsive to clean-ingredient, sustainability, and wellness claims', 28-48, high income)
    is the clear non-competing fit. pub_001 Swiftcart (alcohol subcategory, late-night spike, 18-34) has
    the right moment for an alcohol alternative but an alcohol retailer may not accept 'drink without
    the hangover' framing, and it is a general grocer, so it is only nice-to-have. pub_012 Daily Form
    is risky because adaptogen benefits are weakly substantiated.
  difficulty: hard
