# Publisher scoring (DECISIONS D8).
#   score = category_fit * price_fit^price_exponent * quality * penalties
# category_fit (will this host's shopper click?) and price_fit (can they afford it?) multiply,
# like pCTR x pCVR in eCPM: a perfect audience match can't rescue an irrelevant or unaffordable host.
# quality = weighted mean of the components below (weights sum to 1).
# Change a weight here, rerun `python -m disco_planner.eval.run`, compare metrics.
quality_weights:
  audience_fit: 0.30     # gender + age overlap with the advertiser's STATED target
  persona_fit: 0.35      # two-hop: plausible personas x their presence on this host
  notes_fit: 0.20        # LLM read of the host's free-text notes (bounded influence)
  scale: 0.05            # log monthly impressions; tiny so big hosts don't win on size alone
  seasonality: 0.10      # gifting uplift close to Nov-Dec for giftable products

# Aggregation family (docs/SCORING.md):
#   score = category_fit^relevance_exponent x price_fit^price_exponent x M_p(quality components; weights)
# M_p is the weighted power mean: p = 1 weighted average (today), p -> 0 geometric mean, p = -inf minimum.
# p sets how much a strong signal can make up for a weak one; exponents are what a log-linear model learns.
# Hand-set. A fit is only adopted if it holds on the holdout TEST brands (eval/holdout_split.yaml);
# an earlier fit used holdout pairs for training and was withdrawn (EXPERIMENTS.md).
relevance_exponent: 1.0
price_exponent: 0.5
quality_p: 1.0

category:
  category_only_cap: 0.5      # "apparel" alone can't make a strong match
  attribute_only_cap: 0.15
  extra_specific_bonus: 0.10  # per additional specific tag (x its weight)
  attribute_bonus: 0.10       # per attribute tag (x its weight), e.g. sustainable

penalties:
  # No competitor penalty: competitor blocking is a HOST SETTING enforced at serving (DECISIONS D21),
  # not a probability baked into fit. Planning only flags it.
  notes_misaligned: 0.80      # applied when notes_fit alignment == -1

recommend:
  min_score: 0.08             # absolute floor (scores are products of [0,1] terms, so small)
  relative_to_top: 0.5        # and at least half the best host's score (scores are relative, not calibrated)
  min_category_fit: 0.20      # never recommend a host with no category link, whatever else matches
  max_publishers: 6
  weak_fit_max_publishers: 3   # no 'strong' host -> small test only
  strong_min_price_fit: 0.40    # strong = specific subcategory match AND shoppers spend near this price

# income tier ordering used by price_fit
income_tiers: [low, mid, mid-high, high]
price_tier_to_income: {budget: mid, mid: mid, premium: mid-high, luxury: high}

gifting:
  season_months: [11, 12]
  lookahead_days: 45          # a planning date within this window of the season counts

# Attribute-like tags: they refine a match but can't create one on their own
# (otherwise "dog food subscription" matches an activewear subscription host).
generic_tags: [women, men, subscription, dtc, sustainable, gifting, natural, organic, mid-life, casual, classic, personalized]
generic_only_cap: 0.15

# ---------------------------------------------------------------- personas
# persona score = affinity * price_compat * audience_compat; a stated-fact conflict excludes.
personas:
  min_score: 0.25
  min_selected: 3        # the brief asks for 3-5 variants; below this we say the extras are exploratory
  max_selected: 5
  # rows: advertiser price tier; columns: persona price_sensitivity
  price_compat:
    luxury:  {low: 1.0, low-medium: 0.8, medium: 0.5, medium-high: 0.3, high: 0.15}
    premium: {low: 1.0, low-medium: 0.9, medium: 0.7, medium-high: 0.5, high: 0.35}
    mid:     {low: 0.8, low-medium: 0.9, medium: 1.0, medium-high: 0.9, high: 0.8}
    budget:  {low: 0.5, low-medium: 0.7, medium: 0.9, medium-high: 1.0, high: 1.0}
    unknown: {low: 0.7, low-medium: 0.7, medium: 0.7, medium-high: 0.7, high: 0.7}

intake:
  self_consistency_samples: 3   # 1 = single greedy call; 3 = majority vote over tags/competitors/conflicts

# Component shapes (were hard-coded; moved here so every number can be tuned and swept).
shape:
  neutral: 0.6                    # value when the advertiser didn't state something: mild, not zero
  price_spread_above: 1.5         # price_fit = exp(-|ln(price/AOV)| / spread); price ABOVE host AOV
  price_spread_below: 2.5         # ... price BELOW host AOV (more forgiving)
  income_gap_penalty: 0.7         # x per income tier the host is below what the price tier needs
  tier_match_value: 0.8           # price unknown but host income suits the tier
  notes_values: {aligned: 1.0, neutral: 0.5, misaligned: 0.0}
  seasonality_values: {in_season: 1.0, off_season: 0.75, non_gift_host: 0.3, non_gift_product: 0.5}

persona_shape:
  overlap_neutral: 0.6            # age-range overlap when either side is unknown
  affinity_base: 0.6              # one shared interest tag
  affinity_step: 0.2              # + per extra shared tag (cap 1)
  gender_balanced: 0.8            # advertiser targets one gender, persona is balanced
  gender_mismatch: 0.3
  audience_gender_weight: 0.5     # audience_compat = w*gender + (1-w)*max(age, floor)
  audience_age_floor: 0.3
  host_category_match: 1.0        # host_fit category term when persona interests meet host tags
  host_category_miss: 0.4
