# Pricing, economics and budget rules (DECISIONS D2, D6).
# EVERY number here is an ASSUMPTION: the catalog has no CPC/CTR/CVR/margin data.
# They are shown to the advertiser as assumptions, and they are the first thing
# real campaign data would replace.

network:
  rev_share_to_publisher: 0.5     # host's cut of spend on its page (assumed)
  max_offers_per_page: 4          # "a small set of curated offers"
  frequency_cap: {per_shopper_per_day: 1, per_shopper_per_week: 3}

priors:
  # VALIDATION STATUS: [sourced] public data · [benchmark] vendor/industry ranges · [assumed] no public
  # data. All of these get replaced by measured rates once the network logs impressions/clicks/orders.
  #
  # [assumed] Offer CTR on a thank-you page. No public benchmark exists for THIRD-PARTY offers there
  # (the 5-15% "take rates" quoted online are a store's own upsells). Set above banner display
  # (~0.1-0.5%) because the shopper is on a page they're already reading.
  ctr: {low: 0.006, mid: 0.012, high: 0.020}
  # [benchmark] click -> first purchase for cold, new-to-brand traffic. Site-wide e-commerce session
  # conversion is ~2.5-3% (Shopify median ~1.4%, top 20% ~3.2%); cold ad clicks convert below a
  # store's average, so mid = 2%.
  cvr: {low: 0.010, mid: 0.020, high: 0.035}
  # [benchmark] category CVR relative to the all-category average (industry tables: food & beverage
  # ~6%, health & beauty ~4.5%, apparel ~3%, home ~1.2% vs ~2.5-3% overall); pet has no public
  # figure ([assumed] 1.1).
  cvr_category_multiplier:
    groceries: 1.6
    beverages: 1.6
    meal_kits: 1.4
    beauty: 1.4
    wellness_dtc: 1.3
    wellness_services: 1.0
    apparel: 1.0
    pet: 1.1
    home: 0.6
    instant_delivery: 1.3
    default: 1.0
  # Relative fit: the CTR/CVR priors above describe an AVERAGE host. A host that fits this advertiser
  # better than average should click and convert above that average (up to x1.4), a weak fit below it
  # (down to x0.6). It's a ratio to the average, not a probability, so > 1 is intended.
  relative_fit_multiplier: {min: 0.6, max: 1.4}
  # [assumed] a host that sells a competing product approves our ad with this probability
  competitor_approval_probability: 0.4
  # [assumed] share of a host's monthly impressions one advertiser can realistically win in month one
  share_of_voice_cap: 0.05
  # [assumed] average impressions per unique shopper over a flight (frequency cap is 3/week), for reach
  avg_frequency: 1.6

economics:
  safety_factor: 0.7              # target CPA = 70% of the max affordable CAC (margin path only)
  # [assumed] LAST resort only: used when the advertiser gives neither target CPA, target ROAS nor margin.
  default_gross_margin:           # by host category the advertiser is closest to
    pet: 0.45
    apparel: 0.60
    beauty: 0.70
    beverages: 0.50
    groceries: 0.40
    home: 0.55
    wellness_dtc: 0.65
    wellness_services: 0.60
    meal_kits: 0.35
    instant_delivery: 0.30
    default: 0.55
  # [assumed] orders per acquired customer over ~6 months (replace with the advertiser's own retention)
  expected_orders:                # orders per acquired customer over ~6 months
    subscription: 4.0
    repeat_consumable: 2.5
    one_time: 1.1
    gift: 1.0
    unknown: 1.3
  default_price_by_tier: {budget: 25, mid: 50, premium: 90, luxury: 300, unknown: 60}
  cpc_floor: 0.25                 # below this no host is worth listing us (assumed)
  cpc_ceiling: 6.00

budget:
  flight_days: 30
  min_clicks_per_publisher: 300   # enough for a usable CTR/CPC read; conversions are directional
  exploration_share: 0.15         # reserve for lower-ranked hosts so we learn, not just exploit
  stop_loss: {cpa_multiple: 2.0, min_clicks: 150}
  gifting_front_load: 1.3         # daily pacing multiplier inside an active gifting moment
  start_bid_fraction: 0.7         # open below the break-even max CPC; real CVR decides whether to raise

pricing_models:
  # D2: which pricing model we recommend, by goal and by maturity
  default: CPC
  awareness: CPM
  tcpa_requirements: {conversion_tracking: true, min_conversions: 50}

# Bid strategy (glossary: "bid higher when the user looks like a high-converter"), phased.
bid_strategy:
  learning_phase: {days: 14, min_clicks_per_host: 300}
  adjustments:
    # conversion likelihood: this shopper's persona match vs the host's average shopper
    conversion_likelihood: {min: 0.80, max: 1.25}
    # pacing: under-delivering -> bid up a little; over-delivering -> bid down
    pacing: {min: 0.85, max: 1.15}
