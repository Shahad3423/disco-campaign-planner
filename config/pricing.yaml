# Pricing, market and budget rules (DECISIONS D2, D23, D24).
# VALIDATION STATUS on every number: [sourced] public data · [benchmark] vendor / industry ranges ·
# [assumed] no public data. All of them are placeholders for rates measured from the network's own logs.

network:
  rev_share_to_publisher: 0.5     # [assumed] host's cut of what advertisers actually pay on its page
  max_offers_per_page: 4          # Disco: "a small set of curated offers" (the auction uses 1 slot, serving.yaml)
  frequency_cap: {per_shopper_per_day: 1, per_shopper_per_week: 3}

priors:
  # [benchmark] offer CTR on a post-purchase page. Rokt reports a 4.03% average for its post-purchase offers
  # (vendor claim; vs Google Display ~0.4%, Facebook ~1.5%). Mid set below the vendor figure.
  ctr: {low: 0.015, mid: 0.030, high: 0.045}
  # [benchmark] click -> first purchase for new-to-brand traffic: e-commerce sessions convert ~2.5-3%
  # (Shopify median ~1.4%); Rokt reports 6.3% (vendor claim, its own definition). Mid 2.5%.
  cvr: {low: 0.012, mid: 0.025, high: 0.045}
  # [benchmark] category CVR relative to the average (food & beverage ~6%, beauty ~4.5%, apparel ~3%, home ~1.2%)
  cvr_category_multiplier:
    groceries: 1.6
    beverages: 1.6
    meal_kits: 1.4
    beauty: 1.4
    wellness_dtc: 1.3
    wellness_services: 1.0
    apparel: 1.0
    pet: 1.1
    home: 0.6
    instant_delivery: 1.3
    default: 1.0
  # Relative fit: the priors describe an AVERAGE host; a better-fitting host clicks/converts above average
  # (up to x1.4), a weak one below (x0.6). A ratio to the average, so > 1 is intended.
  relative_fit_multiplier: {min: 0.6, max: 1.4}
  # [assumed] impressions per unique shopper over a flight (frequency cap 3/week), to turn impressions into reach
  avg_frequency: 1.6

# The simulated market (D24): what other advertisers bid, so prices come from competition, not a guess.
market:
  # [benchmark] typical CPC an advertiser in this category pays, anchored to e-commerce CPC ranges:
  # Meta apparel ~$0.45, e-commerce $0.57-1.37, beauty $0.33-1.81; native (Taboola/Outbrain) $0.10-1.20.
  # Post-purchase traffic is high-intent, so the middle of those ranges rather than the bottom.
  cpc_by_category:
    apparel: 0.70
    beauty: 1.10
    pet: 0.95
    home: 1.10
    wellness_dtc: 1.20
    wellness_services: 1.00
    beverages: 0.80
    groceries: 0.70
    meal_kits: 1.30
    instant_delivery: 0.60
    default: 0.90
  # [assumed] higher-priced products are worth more per click, so their advertisers bid more
  price_tier_multiplier: {budget: 0.75, mid: 1.0, premium: 1.3, luxury: 1.8, unknown: 1.0}
  # [assumed] advertisers in the same category don't bid identically (margins, goals): +/- this, fixed per advertiser
  advertiser_spread: 0.25
  # [benchmark-shaped] per-page-view variation of each rival's bid (pacing state, shopper-level adjustments).
  # Winning-price distributions in ad auctions are close to log-normal (Cui et al., KDD 2011).
  per_view_sigma: 0.35
  samples_per_host: 400           # simulated page views per host to estimate the bid landscape
  # Calibration: the CPC benchmarks above are prices advertisers PAY. In a one-slot auction the price is set
  # by the strongest of many rivals, so raw bids would clear far above them. All rival bids are scaled so the
  # median clearing price (for an average campaign, across hosts) equals this [benchmark] figure.
  target_median_clearing_cpc: 0.90

economics:
  # used only for target ROAS (revenue per customer) and the forecast's conversion value
  expected_orders:                # [assumed] orders per acquired customer over ~6 months
    subscription: 4.0
    repeat_consumable: 2.5
    one_time: 1.1
    gift: 1.0
    unknown: 1.3
  default_price_by_tier: {budget: 25, mid: 50, premium: 90, luxury: 300, unknown: 60}
  cpc_floor: 0.05                 # smallest bid the auction accepts

budget:
  flight_days: 30
  gifting_front_load: 1.3         # daily pacing multiplier inside an active gifting moment

# How aggressively the advertiser bids (D24): the most of a host's eligible page views we try to win.
# Winning more means outbidding stronger rivals, so the price per unit rises: that IS the diminishing return.
aggressiveness:
  conservative: 0.30
  balanced: 0.60
  aggressive: 0.90

allocation:
  # Advertiser setting: no host takes more than this share of the budget. Spreads forecast risk, but the
  # bidding eval showed a 50% default costs 24-79% of forecast units when one host is much better and the
  # others can't absorb the spend (budget left unspent). So: OFF by default (1.0); the advertiser can set it
  # and the plan shows what it costs.
  max_share_per_host_default: 1.0
  # forecast spread around the mid estimate, per objective (ranges, not point predictions)
  forecast_spread: {conversions: [0.5, 1.8], clicks: [0.6, 1.5], impressions: [0.85, 1.15], reach: [0.8, 1.15]}

pricing_models:
  tcpa_requirements: {conversion_tracking: true, min_conversions: 50}

# Bid strategy phases (glossary: "bid higher when the user looks like a high-converter")
bid_strategy:
  learning_phase: {days: 14}
  adjustments:
    conversion_likelihood: {min: 0.80, max: 1.25}
