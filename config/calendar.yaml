# US retail moments for 2026-2027.
# intensity = 1.0 from `start` to `end`; before `start` it ramps up over `lead_days`
# (the shopping window before the moment), and it is 0 outside.
# `tags` use the catalog vocabulary (publisher categories/subcategories in data/publishers.json);
# `boosts_personas` are ids from data/shopper_personas.json; `gifting: true` feeds gift_signal.
# Dates are approximate for floating events (Prime-Day-style sales, back-to-school).
events:
